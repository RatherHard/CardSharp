name: cardsharp

# 本地开发依赖编排。
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 停止：docker compose -f deploy/docker-compose.yml down

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cardsharp-postgres
    environment:
      POSTGRES_DB: cardsharp
      POSTGRES_USER: cardsharp
      POSTGRES_PASSWORD: cardsharp
      # 中文排序与大小写不敏感比较
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardsharp -d cardsharp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cardsharp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cardsharp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 嵌入服务（bge-m3）。首次启动会下载模型，约 2GB。
  # 不需要 RAG 时可注释掉。
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: cardsharp-tei
    command: ["--model-id", "BAAI/bge-m3", "--port", "80"]
    ports:
      - "8080:80"
    volumes:
      - teidata:/data
    profiles: ["rag"]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cardsharp-api
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cardsharp:cardsharp@postgres:5432/cardsharp
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      EMBEDDING_BASE_URL: http://tei:80
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles: ["full"]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cardsharp-worker
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cardsharp:cardsharp@postgres:5432/cardsharp
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      EMBEDDING_BASE_URL: http://tei:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: ["arq", "app.workers.main.WorkerSettings"]
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  teidata:
