name: Bug 报告
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现的信息。
        **安全漏洞请勿公开提交**，直接联系项目负责人。

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按顺序列出操作步骤
      placeholder: |
        1. 打开 App
        2. 进入「考研政治」卡片集
        3. 点击「开始复习」
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 如有报错，请粘贴完整堆栈
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      multiple: true
      options:
        - Android
        - iOS
        - 后端 API
        - 其他

  - type: input
    id: version
    attributes:
      label: 版本
      description: App 版本 / 后端 commit SHA
      placeholder: v0.1.0 / 8db0d28

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、日志、网络请求等
    validations:
      required: false
