name: 功能需求
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认该需求是否在 [MVP 范围](docs/02-MVP需求文档.md) 内。
        MVP 范围外的需求会进入后续版本，仍欢迎提出。

  - type: textarea
    id: story
    attributes:
      label: 用户故事
      description: 作为 <角色>，我希望 <功能>，以便 <价值>
      placeholder: 作为备考型学习者，我希望导入 PDF 后自动生成卡片，以便节省制卡时间。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用 Given / When / Then 描述
      placeholder: |
        - Given 用户上传 30 页 PDF
        - When 生成任务完成
        - Then 展示 30 张卡片草稿，可逐张编辑与确认
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0（阻塞核心流程）
        - P1（重要，可降级）
        - P2（锦上添花）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代实现？
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，确认不是重复
          required: true
        - label: 我已阅读 MVP 需求文档，确认该需求未被排除
          required: true
